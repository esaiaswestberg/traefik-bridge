name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.57.2"
      - run: make generate
      - run: git diff --exit-code
      - run: make check
      - run: make build-linux
      - run: make integration-docker-provider
