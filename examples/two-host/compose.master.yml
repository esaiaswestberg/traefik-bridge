services:
  traefik:
    image: traefik:v3.6.25
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/bridge/bridge-transport.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bridge-master-data:/bridge:ro
    networks:
      - bridge
  bridge-master:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.master
    image: traefik-bridge-master:local
    environment:
      BRIDGE_DATA_DIR: /bridge
      BRIDGE_PROXY_IMAGE: traefik-bridge-proxy:local
      BRIDGE_PROXY_CERTIFICATE_MOUNT: bridge-master-data:/bridge
      BRIDGE_ENROLLMENT_ADDRESS: :8445
      # Refresh route tokens one minute before their five-minute default expiry.
      BRIDGE_ROUTE_TOKEN_REFRESH_BEFORE: 1m
    ports:
      - "9443:8443"
      - "9445:8445"
    volumes:
      # Docker socket access lets master control containers on this host.
      - /var/run/docker.sock:/var/run/docker.sock
      - bridge-master-data:/bridge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  bridge-proxy-image:
    profiles: [image-build]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.proxy
    image: traefik-bridge-proxy:local

networks:
  # This existing local network must have the same name supplied by each slave.
  # Generated proxies join it so Traefik can reach their dynamic listener ports.
  bridge:
    name: ${BRIDGE_DOCKER_NETWORK:?set BRIDGE_DOCKER_NETWORK to the local proxy network}
    external: true

volumes:
  bridge-master-data:
