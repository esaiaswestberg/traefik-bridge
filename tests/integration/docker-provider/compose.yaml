services:
  certs:
    image: alpine:3.22
    volumes:
      - certs:/certs
      - ./certs.sh:/certs.sh:ro
    entrypoint: ["/bin/sh", "/certs.sh"]

  traefik:
    image: traefik:v3.6.25
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - 127.0.0.1:18080:80
      - 127.0.0.1:18081:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - certs:/certs:ro

  router-config:
    image: alpine:3.22
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.bridge.rule: Host(`spike.local`)
      traefik.http.routers.bridge.entrypoints: web
      traefik.http.routers.bridge.service: bridge-service
      # Docker requires each enabled container to declare a service port, even
      # when this container contributes only a router for another service.
      traefik.http.services.router-config-placeholder.loadbalancer.server.port: "80"

  backend:
    build: ./backend
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
    labels:
      traefik.enable: "true"
      traefik.http.services.bridge-service.loadbalancer.server.port: "8443"
      traefik.http.services.bridge-service.loadbalancer.server.scheme: https
      traefik.http.services.bridge-service.loadbalancer.serverstransport: bridge-mtls@file
      traefik.http.services.bridge-service.loadbalancer.healthcheck.path: /health/bridge-preserved
      traefik.http.services.bridge-service.loadbalancer.healthcheck.scheme: https
      traefik.http.services.bridge-service.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.bridge-service.loadbalancer.healthcheck.timeout: 1s

volumes:
  certs:
