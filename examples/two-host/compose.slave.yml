services:
  bridge-slave:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.slave
    image: traefik-bridge-slave:local
    environment:
      BRIDGE_SLAVE_ID: ${BRIDGE_SLAVE_ID:?set BRIDGE_SLAVE_ID to the slave identity}
      BRIDGE_MASTER_ADDRESS: ${BRIDGE_MASTER_ADDRESS:?set BRIDGE_MASTER_ADDRESS to the private master address}
      BRIDGE_ENROLLMENT_ADDRESS: ${BRIDGE_ENROLLMENT_ADDRESS:?set BRIDGE_ENROLLMENT_ADDRESS to the private master enrollment address}
      BRIDGE_MASTER_SERVER_NAME: ${BRIDGE_MASTER_SERVER_NAME:-bridge-master}
      BRIDGE_DATA_ADDRESS: ${BRIDGE_DATA_ADDRESS:?set BRIDGE_DATA_ADDRESS to this host's private address}
      BRIDGE_DATA_LISTEN_ADDRESS: :8444
      BRIDGE_DOCKER_NETWORK: ${BRIDGE_DOCKER_NETWORK:?set BRIDGE_DOCKER_NETWORK to the application Docker network}
      # Leave empty after enrollment; persisted credentials are then used.
      BRIDGE_DEVELOPMENT_PAIRING_CODE: ${BRIDGE_DEVELOPMENT_PAIRING_CODE:-}
    volumes:
      # Keep this read-only; slave only discovers local application containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BRIDGE_SLAVE_CREDENTIALS_DIR:?set BRIDGE_SLAVE_CREDENTIALS_DIR to a writable credentials directory}:/run/bridge
    ports:
      - "9444:8444"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
