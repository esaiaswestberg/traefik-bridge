name: Publish Images

on:
  push:
    branches:
      - main
  release:
    types:
      - created

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: master
            dockerfile: deploy/docker/Dockerfile.master
          - name: slave
            dockerfile: deploy/docker/Dockerfile.slave
          - name: proxy
            dockerfile: deploy/docker/Dockerfile.proxy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "primary=latest" >> "$GITHUB_OUTPUT"
            echo "secondary=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "primary=nightly" >> "$GITHUB_OUTPUT"
            echo "secondary=nightly-$(date -u +'%y%m%d%H%M')" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ steps.tags.outputs.primary }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ steps.tags.outputs.secondary }}
